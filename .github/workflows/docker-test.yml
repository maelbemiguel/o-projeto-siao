name: Docker environment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      LARAVEL_SERVICE: app
      APPLICATION_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare test environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' \
            -e 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8080|' \
            -e 's/^DB_HOST=.*/DB_HOST=db/' \
            -e 's/^DB_PORT=.*/DB_PORT=3306/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=db_sistema/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=siao/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=siao_password/' \
            .env

          application_key="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=.*|APP_KEY=${application_key}|" .env
          printf '\nINSTALL_DEV_DEPENDENCIES=true\n' >> .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        timeout-minutes: 20
        run: docker compose build

      - name: Start Docker services
        timeout-minutes: 5
        run: docker compose up -d

      - name: Wait for healthy services
        shell: bash
        run: |
          deadline=$((SECONDS + 180))
          services="$(docker compose config --services)"

          while (( SECONDS < deadline )); do
            all_healthy=true

            for service in ${services}; do
              container_id="$(docker compose ps -q "${service}")"

              if [[ -z "${container_id}" ]]; then
                echo "Service ${service} has no container."
                exit 1
              fi

              state="$(docker inspect --format '{{.State.Status}}' "${container_id}")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_id}")"

              if [[ "${state}" != "running" ]]; then
                echo "Service ${service} is ${state}."
                exit 1
              fi

              if [[ "${health}" == "unhealthy" ]]; then
                echo "Service ${service} is unhealthy."
                exit 1
              fi

              if [[ "${health}" != "healthy" ]]; then
                all_healthy=false
              fi
            done

            if [[ "${all_healthy}" == "true" ]]; then
              echo "All services are healthy."
              exit 0
            fi

            sleep 3
          done

          echo "Timed out waiting for healthy services."
          docker compose ps
          exit 1

      - name: Show service status
        run: docker compose ps

      - name: Run database migrations
        timeout-minutes: 5
        run: docker compose exec -T "${LARAVEL_SERVICE}" php artisan migrate --force --no-interaction

      - name: Run Laravel tests
        timeout-minutes: 10
        run: >-
          docker compose exec -T -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory:
          "${LARAVEL_SERVICE}" php artisan test

      - name: Verify application over HTTP
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 2 --output /dev/null "${APPLICATION_URL}/up"
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 2 --output /dev/null "${APPLICATION_URL}/"

      - name: Show Docker logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: docker compose logs --no-color --timestamps

      - name: Stop Docker services
        if: ${{ always() }}
        continue-on-error: true
        run: docker compose down -v --remove-orphans
