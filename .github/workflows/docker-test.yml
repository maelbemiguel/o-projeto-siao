name: Docker environment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      LARAVEL_SERVICE: app
      APPLICATION_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare test environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' \
            -e 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8080|' \
            -e 's/^DB_HOST=.*/DB_HOST=db/' \
            -e 's/^DB_PORT=.*/DB_PORT=3306/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=db_sistema/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=siao/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=siao_password/' \
            .env

          application_key="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=.*|APP_KEY=${application_key}|" .env
          printf '\nINSTALL_DEV_DEPENDENCIES=true\n' >> .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        timeout-minutes: 20
        run: docker compose build

      - name: Start Docker services
        timeout-minutes: 5
        run: docker compose up -d

      - name: Wait for MySQL and PHP-FPM
        timeout-minutes: 4
        shell: bash
        run: |
          deadline=$((SECONDS + 180))
          services=(db "${LARAVEL_SERVICE}")

          while (( SECONDS < deadline )); do
            pending_services=0

            for service in "${services[@]}"; do
              container_id="$(docker compose ps --all --quiet "${service}")"

              if [[ -z "${container_id}" ]]; then
                echo "Service ${service} has no container."
                exit 1
              fi

              state="$(docker inspect --format '{{.State.Status}}' "${container_id}")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_id}")"

              if [[ "${state}" != "running" ]]; then
                echo "Service ${service} is ${state}."
                exit 1
              fi

              case "${health}" in
                healthy)
                  ;;
                starting)
                  pending_services=$((pending_services + 1))
                  ;;
                unhealthy)
                  echo "Service ${service} is unhealthy."
                  exit 1
                  ;;
                *)
                  echo "Service ${service} has no usable healthcheck (status: ${health})."
                  exit 1
                  ;;
              esac
            done

            if (( pending_services == 0 )); then
              echo "MySQL and PHP-FPM are healthy."
              exit 0
            fi

            sleep 3
          done

          echo "Timed out waiting for MySQL and PHP-FPM."
          exit 1

      - name: Run database migrations
        timeout-minutes: 5
        run: docker compose exec -T "${LARAVEL_SERVICE}" php artisan migrate --force --no-interaction

      - name: Wait for Nginx
        timeout-minutes: 2
        shell: bash
        run: |
          deadline=$((SECONDS + 60))

          while (( SECONDS < deadline )); do
            container_id="$(docker compose ps --all --quiet nginx)"

            if [[ -z "${container_id}" ]]; then
              echo "Service nginx has no container."
              exit 1
            fi

            state="$(docker inspect --format '{{.State.Status}}' "${container_id}")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_id}")"

            if [[ "${state}" != "running" ]]; then
              echo "Service nginx is ${state}."
              exit 1
            fi

            case "${health}" in
              healthy)
                echo "Nginx is healthy."
                exit 0
                ;;
              starting)
                sleep 3
                ;;
              unhealthy)
                echo "Service nginx is unhealthy."
                exit 1
                ;;
              *)
                echo "Service nginx has no usable healthcheck (status: ${health})."
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Nginx."
          exit 1

      - name: Show service status
        run: docker compose ps

      - name: Verify application over HTTP
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 2 --output /dev/null --write-out 'HTTP %{http_code} %{url_effective}\n' "${APPLICATION_URL}/up"
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 2 --output /dev/null --write-out 'HTTP %{http_code} %{url_effective}\n' "${APPLICATION_URL}/"

      - name: Run Laravel tests
        timeout-minutes: 10
        run: >-
          docker compose exec -T -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory:
          "${LARAVEL_SERVICE}" php artisan test

      - name: Show Docker diagnostics on failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          echo '::group::docker compose ps'
          docker compose ps --all || true
          echo '::endgroup::'

          echo '::group::docker compose logs'
          docker compose logs --no-color --timestamps || true
          echo '::endgroup::'

          echo '::group::Laravel log'
          app_container_id="$(docker compose ps --all --quiet "${LARAVEL_SERVICE}" 2>/dev/null || true)"
          app_state=""

          if [[ -n "${app_container_id}" ]]; then
            app_state="$(docker inspect --format '{{.State.Status}}' "${app_container_id}" 2>/dev/null || true)"
          fi

          if [[ "${app_state}" == "running" ]]; then
            docker compose exec -T "${LARAVEL_SERVICE}" sh -c '
              if [ -f storage/logs/laravel.log ]; then
                tail -n 500 storage/logs/laravel.log
              else
                echo "storage/logs/laravel.log does not exist."
              fi
            ' || true
          else
            echo "The app container is not running; Laravel log cannot be read with docker compose exec."
          fi
          echo '::endgroup::'

          echo '::group::Container healthchecks'
          services="$(docker compose config --services 2>/dev/null || true)"

          for service in ${services}; do
            container_id="$(docker compose ps --all --quiet "${service}" 2>/dev/null || true)"

            if [[ -z "${container_id}" ]]; then
              echo "Service ${service}: container not found."
              continue
            fi

            echo "--- ${service} ---"
            docker inspect --format 'Container={{.Name}} State={{.State.Status}} ExitCode={{.State.ExitCode}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}' "${container_id}" || true
            docker inspect --format '{{json .State.Health}}' "${container_id}" || true
          done
          echo '::endgroup::'

      - name: Stop Docker services
        if: ${{ always() }}
        continue-on-error: true
        run: docker compose down -v --remove-orphans
