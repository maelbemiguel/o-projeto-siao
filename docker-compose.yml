services:

  # ── Aplicação PHP ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siao_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_KEY: base64:pZVqJPXVU4i+Ly+NgJbLei66YuHr1RIY7deaoO6EaRA=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_sistema
      DB_USERNAME: siao
      DB_PASSWORD: siao_password
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:8080"
      L5_SWAGGER_GENERATE_ALWAYS: "true"
      L5_SWAGGER_CONST_HOST: "http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siao_net

  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: siao_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - siao_net

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: siao_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_sistema
      MYSQL_USER: siao
      MYSQL_PASSWORD: siao_password
    ports:
      - "3307:3306"
    volumes:
      - siao_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "siao", "-psiao_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siao_net

volumes:
  siao_db_data:

networks:
  siao_net:
    driver: bridge
