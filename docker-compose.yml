services:

  # ── Aplicação PHP ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV_DEPENDENCIES: "${INSTALL_DEV_DEPENDENCIES:-false}"
    container_name: siao_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
      - /var/www/html/vendor
      - /var/www/html/storage
      - /var/www/html/bootstrap/cache
      - siao_build_data:/var/www/html/public/build
    environment:
      APP_NAME: "Sião Cartórios"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:pZVqJPXVU4i+Ly+NgJbLei66YuHr1RIY7deaoO6EaRA=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"

      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      APP_FAKER_LOCALE: pt_BR

      APP_MAINTENANCE_DRIVER: file

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: debug

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_sistema
      DB_USERNAME: siao
      DB_PASSWORD: siao_password

      SESSION_DRIVER: file
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "false"

      BROADCAST_CONNECTION: log
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local

      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:8080,127.0.0.1,127.0.0.1:8080"

      L5_SWAGGER_GENERATE_ALWAYS: "true"
      L5_SWAGGER_UI_DOC_EXPANSION: list
      L5_SWAGGER_UI_PERSIST_AUTHORIZATION: "true"
      L5_SWAGGER_CONST_HOST: "http://localhost:8080"

      MAIL_MAILER: log

      VITE_APP_NAME: "Sião Cartórios"
      VITE_API_URL: "http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - siao_net

  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: siao_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - siao_build_data:/var/www/html/public/build
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - siao_net

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: siao_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_sistema
      MYSQL_USER: siao
      MYSQL_PASSWORD: siao_password
    ports:
      - "3307:3306"
    volumes:
      - siao_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "siao", "-psiao_password"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - siao_net

volumes:
  siao_db_data:
  siao_build_data:

networks:
  siao_net:
    driver: bridge
